name: nosmai_zoom_bridge
description: Publish a Nosmai-filtered camera to a Zoom Video SDK session from Flutter.
version: 0.1.0
publish_to: none
homepage: https://nosmai.com
repository: https://github.com/nosmai/nosmai_zoom_bridge
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.29.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_zoom_videosdk: 2.6.0
  nosmai_effects_sdk:
    git:
      url: https://github.com/nosmai/nosmai_effects_sdk_flutter.git
      ref: beta/2.0.3-beta.1
  yaml: ^3.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.nosmai.zoom
        pluginClass: NosmaiZoomBridgePlugin
      ios:
        pluginClass: NosmaiZoomBridgePlugin
